<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Londrina+Solid:wght@400&display=swap" />
<style>
  body { margin: 0; background: #0d0a18; }
</style>
</helmet>
<div style="min-height:100vh;background:#0d0a18;color:#e8e4f5;font-family:'Space Grotesk',system-ui,sans-serif;padding:24px clamp(16px,3vw,40px) 48px;display:flex;flex-direction:column;gap:22px">

  <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#ff8a3d">Polish pass</span>
      <h1 style="margin:0;font-family:'Londrina Solid',sans-serif;font-weight:400;font-size:38px;line-height:1;color:#fff">Bush League — review</h1>
    </div>
    <span style="font-size:13px;color:#6f6a8c">one style.css · echo trail · mobile spacing · image loading</span>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <sc-for list="{{ pages }}" as="p" hint-placeholder-count="6">
      <button type="button" onClick="{{ p.select }}" style="{{ p.style }}">{{ p.label }}</button>
    </sc-for>
  </div>

  <div style="display:grid;grid-template-columns:390px minmax(0,1fr);gap:28px;align-items:start">

    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#90b8cd">iPhone · 390 × 844</span>
      <div style="width:390px;height:844px;border-radius:38px;padding:10px;background:#1b1630;border:1px solid rgba(144,184,205,.22);box-shadow:0 30px 80px rgba(0,0,0,.55)">
        <div style="position:relative;width:100%;height:100%;border-radius:29px;overflow:hidden;background:#06040f">
          <iframe src="{{ phoneSrc }}" title="Phone preview" style="width:100%;height:100%;border:0;display:block"></iframe>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
      <span style="font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#90b8cd">Desktop · 1440 wide</span>
      <div style="position:relative;width:100%;height:844px;border-radius:14px;overflow:hidden;border:1px solid rgba(144,184,205,.22);background:#06040f;box-shadow:0 30px 80px rgba(0,0,0,.55)">
        <iframe src="{{ deskSrc }}" title="Desktop preview" style="width:1440px;height:1100px;border:0;display:block;transform-origin:top left;transform:scale(.62)"></iframe>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 'index.html' };

  renderVals() {
    const pages = [
      ['index.html', 'Home'],
      ['tour.html', 'Tour'],
      ['live.html', 'Live'],
      ['gallery.html', 'Gallery'],
      ['bio.html', 'About'],
      ['contact.html', 'Contact'],
    ];
    const cur = this.state.page;
    return {
      phoneSrc: cur,
      deskSrc: cur,
      pages: pages.map(([href, label]) => ({
        label,
        select: () => this.setState({ page: href }),
        style: [
          'font-family:inherit;font-size:14px;letter-spacing:.04em;padding:9px 18px;border-radius:999px;cursor:pointer',
          href === cur
            ? 'background:linear-gradient(270deg,#ff8a3d,#ff4d9d 60%,#af34e3);color:#fff;border:1px solid transparent'
            : 'background:rgba(144,184,205,.06);color:#90b8cd;border:1px solid rgba(144,184,205,.25)'
        ].join(';')
      }))
    };
  }
}

</script>
</body>
</html>
